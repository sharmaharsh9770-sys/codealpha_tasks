<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAQ Assistant</title>
<style>
*{box-sizing:border-box}:root{--ink:#20243a;--muted:#737b90;--accent:#635bdb;--line:#e5e8f1}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef2ff,#f7f4ff);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);padding:24px}.app{max-width:860px;margin:auto}.header{display:flex;align-items:center;gap:14px;margin-bottom:22px}.avatar{width:52px;height:52px;display:grid;place-items:center;border-radius:17px;background:var(--accent);color:white;font-size:1.6rem}.header h1{margin:0;font-size:1.7rem}.header p{margin:5px 0 0;color:var(--muted)}.chat{height:min(68vh,650px);min-height:450px;display:flex;flex-direction:column;background:white;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 20px 50px #33385d12}.chathead{padding:15px 19px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);font-weight:750}.dot{width:9px;height:9px;background:#26b67a;border-radius:50%}.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}.msg{max-width:min(84%,600px);padding:13px 16px;border-radius:16px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.bot{background:#f1f2ff;align-self:flex-start;border-bottom-left-radius:5px}.user{background:var(--accent);color:white;align-self:flex-end;border-bottom-right-radius:5px}.match{font-size:.76rem;font-weight:750;color:#6c64d8;margin-bottom:5px}.suggestions{padding:0 18px 14px;display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #deddfb;background:#faf9ff;color:#554dc1;padding:8px 11px;border-radius:999px;font:inherit;font-size:.83rem;cursor:pointer}.composer{padding:14px;border-top:1px solid var(--line);display:flex;gap:10px;background:#fff}.composer input{min-width:0;flex:1;padding:13px 15px;border:1px solid var(--line);border-radius:13px;font:inherit;outline-color:var(--accent)}.send{border:0;border-radius:13px;background:var(--accent);color:white;padding:0 20px;font:inherit;font-weight:750;cursor:pointer}.foot{text-align:center;color:var(--muted);font-size:.83rem;margin-top:14px}.reset{margin-left:auto;border:0;background:transparent;color:var(--accent);font:inherit;cursor:pointer}@media(max-width:560px){body{padding:14px}.chat{height:70vh;min-height:420px}.messages{padding:14px}.msg{max-width:92%}.composer{padding:10px}.send{padding:0 14px}}
</style></head><body><main class="app">
<div class="header"><div class="avatar">✦</div><div><h1>FAQ Assistant</h1><p>Ask a question and get a helpful answer.</p></div></div>
<section class="chat"><div class="chathead"><span class="dot"></span> Help Desk Bot <button class="reset" id="resetBtn">New chat ↻</button></div>
<div class="messages" id="messages" aria-live="polite"></div>
<div class="suggestions" id="suggestions"><button class="chip">What are your working hours?</button><button class="chip">How do I reset my password?</button><button class="chip">How can I contact support?</button></div>
<form class="composer" id="chatForm"><input id="question" autocomplete="off" maxlength="500" placeholder="Type your question…" aria-label="Your question"><button class="send" type="submit">Send ➤</button></form></section>
<div class="foot">Demo FAQ bot · Answers are matched from a local FAQ knowledge base.</div></main>
<script>
const faqs=[
{q:"What are your working hours?",a:"Our support team is available Monday to Friday, 9:00 AM–5:00 PM. Hours may vary on public holidays.",keywords:["working hours","office hours","open","timing","time","when are you available"]},
{q:"How do I reset my password?",a:"Open the sign-in page and choose “Forgot password?”. Follow the reset link sent to your registered email. If it does not arrive, check your spam folder.",keywords:["reset password","forgot password","change password","can't login","cannot log in","sign in"]},
{q:"How can I contact support?",a:"You can contact the support team at support@example.com. Include a short description of the issue and any relevant error message. This is a demo address for this sample app.",keywords:["contact support","email","phone","help","customer service","contact"]},
{q:"How do I create an account?",a:"Select “Sign up” on the home page, enter your name and email, create a strong password, and follow the email verification instructions.",keywords:["create account","sign up","register","new account","join"]},
{q:"Is the service free?",a:"This demo does not process payments. For a real product, check its official pricing page or contact its support team for current plan details.",keywords:["free","price","pricing","cost","payment","subscription"]},
{q:"How do I update my profile?",a:"Sign in, open Settings or My Profile, update the fields you need, and press Save. Some changes may require email verification.",keywords:["update profile","edit profile","change name","settings","personal details"]},
{q:"What should I do if the app is not working?",a:"Try refreshing the page, checking your internet connection, and updating your browser. If the issue continues, contact support with the steps that caused it.",keywords:["not working","error","bug","broken","problem","issue","doesn't work"]},
{q:"Can I delete my account?",a:"Look in Account Settings for a Delete Account option. Read the confirmation carefully first; account deletion may permanently remove your saved information.",keywords:["delete account","close account","remove account","cancel account"]},
{q:"How is my information stored?",a:"This sample chatbot processes your question in your browser and does not send it to a server. Avoid entering passwords or other sensitive personal information.",keywords:["privacy","data","information stored","security","personal information"]}
];
function tokenize(s){return s.toLowerCase().replace(/[^a-z0-9\\s]/g," ").split(/\\s+/).filter(w=>w.length>1&&!["the","and","for","are","how","what","can","you","your","does","do","is","a","an","to","i","my","of","in","it"].includes(w))}
function score(question,faq){const q=question.toLowerCase(),tokens=tokenize(question);let points=0;for(const kw of faq.keywords){if(q.includes(kw))points=Math.max(points,kw.split(" ").length>1?5:3)}const set=new Set(tokenize(faq.q+" "+faq.keywords.join(" ")));let overlap=0;for(const t of tokens)if(set.has(t))overlap++;const similarity=overlap/Math.max(1,new Set(tokens).size);return points+similarity*4}
const $=id=>document.getElementById(id);const messages=$("messages");
function addMessage(text,who,match){const div=document.createElement("div");div.className="msg "+who;if(match){const tag=document.createElement("div");tag.className="match";tag.textContent="Best FAQ match · "+match;div.appendChild(tag)}div.appendChild(document.createTextNode(text));messages.appendChild(div);messages.scrollTop=messages.scrollHeight}
function answerQuestion(raw){const q=raw.trim();if(!q)return;addMessage(q,"user");const ranked=faqs.map(f=>({faq:f,score:score(q,f)})).sort((a,b)=>b.score-a.score);const best=ranked[0];if(best.score<1.2){addMessage("Sorry, I couldn't find a close answer in the current FAQ list. Try rephrasing your question or contact support@example.com (demo address).","bot")}else{addMessage(best.faq.a,"bot",best.faq.q)}}
$("chatForm").addEventListener("submit",e=>{e.preventDefault();const q=$("question").value;$("question").value="";answerQuestion(q);$("question").focus()});
$("suggestions").addEventListener("click",e=>{if(e.target.classList.contains("chip"))answerQuestion(e.target.textContent)});
$("resetBtn").onclick=()=>{messages.innerHTML="";addMessage("Hello! I'm the FAQ assistant. Ask me about account setup, passwords, support, or common app issues.","bot");$("question").focus()};
addMessage("Hello! I'm the FAQ assistant. Ask me about account setup, passwords, support, or common app issues.","bot");
</script></body></html>
